<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>assignment04</title>

    <style>
        body {
			background: whitesmoke;
		} 
		#page {
			width: 928px;
			height: 1228px;
			background: lightgray;
			border: 0px solid darkgray;
            margin: 0 auto;
		} 
		h1 {
			text-align: center;
			font: 36pt/1.4em Impact;
		}
		#textbox {
			width: 908px;
			height: 1024px;
			margin: 0 auto;
			background: darkgray;
			box-shadow: 2px 3px 6px gainsboro;
			border: 10px solid gainsboro;
			display: flex;
			justify-content: center;
			aligh-items: flex-start;
			flex-wrap: wrap;
		}
        @font-face {
            font-family: Georgia;
            src: url("georgia.ttf");
		}
		p {
			font: 14pt/1.4em Georgia, sans-serif;
			width: 760px;
			margin: 12px auto;
		}
        #banner {
            width: 928px;
			height: 25%;
			float: none;
			margin: none;
            border: none;
			box-shadow: none;
        }
		#asset1, .zoom {
            width: 200px;
            float: left;
            margin: 6px 24px 24px 0;
            border: 1px solid dimgray;
			box-shadow: 2px 3px 6px
			transition: transform 0.5s;
			background: url("magazine_makeover.jpg");
			background-size: 100%
			background-position: center;
        }
		#asset1:hover {
			transform: scale(1.03);
			transition: transform 0.5s;
			background-size: 105%;
			transition: background-size 0.5s;
		}
		#asset2, .zoom {
            width: 200px;
            float: left;
            margin: 6px 24px 24px 0;
            border: 1px solid dimgray;
			box-shadow: 2px 3px 6px
			transition: transform 0.5s;
			background: url("foundation_mock.png");
			background-size: 100%
			background-position: center;
        }
		#asset2:hover {
			transform: scale(1.03);
			transition: transform 0.5s;
			background-size: 105%;
			transition: background-size 0.5s;
		}
		#asset3, .zoom {
            width: 200px;
            float: left;
            margin: 6px 24px 24px 0;
            border: 1px solid dimgray;
			box-shadow: 2px 3px 6px
			transition: transform 0.5s;
			background: url("speedpaint_ironwill.png");
			background-size: 100%
			background-position: center;
        }
		#asset3:hover {
			transform: scale(1.03);
			transition: transform 0.5s;
			background-size: 105%;
			transition: background-size 0.5s;
		}
		figure {
			width: 640px;
			margin: 0 auto;
		}
		figurecaption {
			font: 12pt/1.4em Candara;
			margin-top: 3px
			text-align: left;
		}
    </style>
</head>

<body>
    <div id="page">
	<img id="banner" src="banner_dlz2026.png" alt="Banner">
	
	<h1>Portfolio</h1>
		<div class="container">
				<div id="textbox">
				<p>
					‎
				</p>
				<figure>
					<a href="magazine_makeover.jpg">
					<img id="asset1" src="magazine_makeover_thumb.png" alt="Item1"/>
					</a>
					<p>
           			Esquire Magazine Makeover
			        </p>
					<figurecaption>
					Referencing a pre-existing magazine of Jon Hamm, I created a new design for the magazine using all of the pre-existing text and without adding any additional text.
					</figurecaption>
				</figure>
				<figure>
					<a href="foundation_mock.png">
					<img id="asset2" src="foundation_mock_thumb.png" alt="Item2"/>
					</a>
					<p>
           			Foundation Book Series Sequel
			        </p>
					<figurecaption>
					Referencing the previous seven installations of Isaac Asimov's Foundation series, I created a cover for an eighth potential installation.
					</figurecaption>
				</figure>
				<figure>
					<a href="speedpaint_ironwill.png">
					<img id="asset3" src="speedpaint_ironwill_thumb.png" alt="Item3"/>
					</a>
					<p>
           			Speedpaint of Iron Will (Concept)
			        </p>
					<figurecaption>
					"The Son of Man" by René Magritte was used to create the color palette for this speedpaint. The sketch is of Iron Will, and the color scheme is based on its 2019 concept design.
					</figurecaption>
				</figure>
			</div>
		</div>
    </div>
</body>

</html>
