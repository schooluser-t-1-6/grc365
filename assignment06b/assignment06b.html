<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>assignment06b</title>

    <style>
	
		.container {
  			display: grid;
  			grid-template-columns: 320px 320px;
  			background-color: whitesmoke;
  			padding: 10px;
			width: 640px;
			margin: 0 auto;
			justify-items: center;
		}
		.container div {
  			background-color: whitesmoke;
  			--border: 1px solid black;
  			padding: 0px;
  			font-size: 0px;
  			text-align: center;
		}
		.container > div:nth-child(3) {grid-column: 1 / -1;}
		
        body {
			background: whitesmoke;
		} 
		#page {
			width: 928px;
			height: 1358px;
			background: lightgray;
			border: 0px solid darkgray;
            margin: 0 auto;
		} 
		h1 {
			text-align: center;
			font: 36pt/1.4em Impact;
		}
        @font-face {
            font-family: Georgia;
            src: url("georgia.ttf");
		}
        #banner {
            width: 928px;
			height: 300px;
			float: none;
			margin: none;
            border: none;
			box-shadow: none;
        }
		#asset1, .zoom {
            height: 400px;
			width: 300px;
            float: center;
            margin: 6px 6px 6px 6px;
            border: 1px solid dimgray;
			box-shadow: 2px 3px 6px
			transition: transform 0.5s;
			background: url("magazine_makeover.jpg");
			background-size: 100%
			background-position: center;
			grid-area: 1/1;
        }
		#asset1:hover {
			transform: scale(1.03);
			transition: transform 0.5s;
			background-size: 105%;
			transition: background-size 0.5s;
		}
		#asset2, .zoom {
            height: 400px;
			width: 300px;
            float: center;
            margin: 6px 6px 6px 6px;
			border: 1px solid dimgray;
			box-shadow: 2px 3px 6px
			transition: transform 0.5s;
			background: url("foundation_mock.png");
			background-size: 100%
			background-position: center;
			grid-area: 1/2;
        }
		#asset2:hover {
			transform: scale(1.03);
			transition: transform 0.5s;
			background-size: 105%;
			transition: background-size 0.5s;
		}
		#asset3, .zoom {
            height: 400px;
			width: 620px;
            float: center;
            margin: 6px 6px 6px 6px;
            border: 1px solid dimgray;
			box-shadow: 2px 3px 6px
			transition: transform 0.5s;
			background: url("speedpaint_ironwill.png");
			background-size: 100%
			background-position: center;
			grid-area: 2/1/2/2;
        }
		#asset3:hover {
			transform: scale(1.03);
			transition: transform 0.5s;
			background-size: 105%;
			transition: background-size 0.5s;
		}
    </style>
</head>

<body>
    <div id="page">
	<img id="banner" src="banner_dlz2026.png" alt="Banner">
	
	<h1>Portfolio</h1>
		<div class="container">
			  	<div>
					<a href="magazine_makeover.jpg">
					<img id="asset1" src="magazine_makeover_thumb.png" alt="Item1"/>
					</a>
				</div>
  				<div>
					<a href="foundation_mock.png">
					<img id="asset2" src="foundation_mock_thumb.png" alt="Item2"/>
					</a>
				</div>
  				<div>
					<a href="speedpaint_ironwill.png">
					<img id="asset3" src="speedpaint_ironwill_thumb.png" alt="Item3"/>
					</a>
				</div>
			</div>
	</div>
</body>

</html>
